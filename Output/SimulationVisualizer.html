<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiener Neustadt Simulation Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: white;
            color: #333;
        }

        /* Progress Bar */
        #progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            position: relative;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #45a049);
            width: 0%;
            transition: width 0.1s linear;
        }

        /* Control Panel */
        #control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
        }

        #sim-time {
            font-size: 24px;
            font-weight: bold;
            color: #2196F3;
            font-family: 'Courier New', monospace;
        }

        #controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        button {
            padding: 10px 20px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #2196F3;
            color: white;
            font-weight: 600;
            transition: background 0.3s;
        }

            button:hover {
                background: #1976D2;
            }

            button:active {
                transform: scale(0.98);
            }

            button.pause {
                background: #FF9800;
            }

                button.pause:hover {
                    background: #F57C00;
                }

        #speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #speed-slider {
            width: 150px;
            cursor: pointer;
        }

        #speed-label {
            font-size: 14px;
            font-weight: 600;
            min-width: 60px;
            text-align: right;
        }

        /* File Upload - inline in control panel */
        #file-upload {
            padding: 6px 12px;
            border: 2px dashed #ccc;
            border-radius: 5px;
            background: #fafafa;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

            #file-upload:hover {
                border-color: #2196F3;
                background: #f0f8ff;
            }

            #file-upload.loaded {
                border-color: #4CAF50;
                background: #f1f8f4;
            }

        #file-input {
            display: none;
        }

        #file-label {
            font-size: 12px;
            color: #666;
        }

        #file-upload.loaded #file-label {
            color: #4CAF50;
            font-weight: 600;
        }

        /* Main Content */
        #main-content {
            display: none;
            width: 100%;
            height: calc(100vh - 8px - 70px);
            position: relative;
            background-image: url('vis_background_v1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

            #main-content.visible {
                display: block;
            }

        /* Worker Icons Overlay */
        #worker-grid {
            position: absolute;
            top: 40px;
            left: 700px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            max-width: 400px;
        }

        /* Shunting Loco Icons Overlay */
        #shuntloco-grid {
            position: absolute;
            top: 40px;
            left: 1100px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            max-width: 400px;
        }

        /* Shared icon style */
        .worker-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

            .worker-icon img {
                width: 40px;
                height: 40px;
                object-fit: contain;
                filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.5));
            }

            .worker-icon span {
                font-size: 9px;
                color: white;
                text-shadow: 1px 1px 2px black;
                font-weight: 600;
                text-align: center;
                max-width: 50px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
    </style>
</head>
<body>
    <!-- Progress Bar -->
    <div id="progress-bar">
        <div id="progress-fill"></div>
    </div>

    <!-- Control Panel -->
    <div id="control-panel">
        <div id="controls">
            <button id="play-pause-btn" onclick="togglePlayPause()">Play</button>
            <div id="speed-control">
                <label for="speed-slider">Speed:</label>
                <input type="range" id="speed-slider" min="1" max="200" value="10" oninput="updateSpeed()">
                <span id="speed-label">10x</span>
            </div>
            <button onclick="reset()">Reset</button>
            <div id="file-upload" onclick="document.getElementById('file-input').click()">
                <input type="file" id="file-input" accept=".csv" onchange="loadCSV(event)">
                <p id="file-label">📂 Load CSV</p>
            </div>
        </div>
        <div id="sim-time">09:00:00</div>
    </div>

    <!-- Main Content: background image + overlays -->
    <div id="main-content">
        <div id="worker-grid"></div>
        <div id="shuntloco-grid"></div>
    </div>

    <script>
        let events = [];
        let currentEventIndex = 0;
        let isPlaying = false;
        let playbackSpeed = 10;
        let animationFrameId = null;
        let startRealTime = null;
        let pausedSimTime = 0;
        let simStartTime = null;
        let simEndTime = null;
        let workers = [];
        let shuntLocos = [];

        function loadCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const content = e.target.result;
                parseMeta(content);
                parseCSV(content);

                document.getElementById('file-upload').classList.add('loaded');
                document.getElementById('file-label').textContent = `✅ Loaded: ${file.name} (${events.length} events)`;
                document.getElementById('main-content').classList.add('visible');

                renderWorkerGrid();
                renderShuntLocoGrid();

                if (events.length > 0) {
                    document.getElementById('sim-time').textContent = formatTimeOnly(simStartTime);
                }
            };
            reader.readAsText(file);
        }

        function parseMeta(content) {
            workers = [];
            shuntLocos = [];
            const lines = content.trim().split('\n');
            for (const line of lines) {
                const trimmed = line.trim();
                if (trimmed === '#ENDMETA') break;
                const values = trimmed.split(';').map(v => v.trim());
                if (values[0] === '#WORKER') {
                    workers.push({ id: values[1], name: values[2], speed: values[3] });
                }
                if (values[0] === '#SHUNTLOCO') {
                    shuntLocos.push({ id: values[1], name: values[2], speed: values[3] });
                }
            }
        }

        function renderWorkerGrid() {
            const grid = document.getElementById('worker-grid');
            grid.innerHTML = '';
            for (const worker of workers) {
                const div = document.createElement('div');
                div.className = 'worker-icon';
                div.innerHTML = `
                        <img src="worker_icon.png" alt="${worker.name}" title="${worker.name} (${worker.id})">
                        <span>${worker.name}</span>
                    `;
                grid.appendChild(div);
            }
        }

        function renderShuntLocoGrid() {
            const grid = document.getElementById('shuntloco-grid');
            grid.innerHTML = '';
            for (const loco of shuntLocos) {
                const div = document.createElement('div');
                div.className = 'worker-icon';
                div.innerHTML = `
                        <img src="shunting_loco.png" alt="${loco.name}" title="${loco.name} (${loco.id})">
                        <span>${loco.name}</span>
                    `;
                grid.appendChild(div);
            }
        }

        function parseCSV(content) {
            const lines = content.trim().split('\n');
            events = [];

            // Find where meta ends
            let dataStart = 0;
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].trim() === '#ENDMETA') {
                    dataStart = i + 1;
                    break;
                }
            }

            // Skip the header row after meta
            for (let i = dataStart + 1; i < lines.length; i++) {
                const values = lines[i].split(';').map(v => v.trim());
                if (values.length < 3) continue;

                const event = {
                    eventType: values[0],
                    entityId: values[1],
                    event: values[2],
                    timestamp: values[3],
                    details: values[4] || ''
                };
                events.push(event);
            }

            if (events.length > 0) {
                simStartTime = new Date(events[0].timestamp);
                simEndTime = new Date(events[events.length - 1].timestamp);
                console.log(`✅ Loaded ${events.length} events`);
                console.log(`⏰ Duration: ${formatTimeOnly(simStartTime)} → ${formatTimeOnly(simEndTime)}`);
            }
        }

        function formatTimeOnly(date) {
            const hour = String(date.getHours()).padStart(2, '0');
            const minute = String(date.getMinutes()).padStart(2, '0');
            const second = String(date.getSeconds()).padStart(2, '0');
            return `${hour}:${minute}:${second}`;
        }

        function togglePlayPause() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('play-pause-btn');

            if (isPlaying) {
                btn.textContent = 'Pause';
                btn.classList.add('pause');
                startRealTime = Date.now();
                animate();
            } else {
                btn.textContent = 'Play';
                btn.classList.remove('pause');

                const realElapsed = Date.now() - startRealTime;
                pausedSimTime += realElapsed * playbackSpeed;

                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                }
            }
        }

        function updateSpeed() {
            const oldSpeed = playbackSpeed;
            playbackSpeed = parseInt(document.getElementById('speed-slider').value);
            document.getElementById('speed-label').textContent = `${playbackSpeed}x`;

            if (isPlaying) {
                const realElapsed = Date.now() - startRealTime;
                pausedSimTime += realElapsed * oldSpeed;
                startRealTime = Date.now();
            }
        }

        function animate() {
            if (!isPlaying || !events.length) return;

            const realElapsed = Date.now() - startRealTime;
            const totalSimElapsed = pausedSimTime + (realElapsed * playbackSpeed);
            const currentSimTime = new Date(simStartTime.getTime() + totalSimElapsed);

            document.getElementById('sim-time').textContent = formatTimeOnly(currentSimTime);

            const totalDuration = simEndTime - simStartTime;
            const currentProgress = currentSimTime - simStartTime;
            const progressPercent = Math.min((currentProgress / totalDuration) * 100, 100);
            document.getElementById('progress-fill').style.width = `${progressPercent}%`;

            while (currentEventIndex < events.length) {
                const eventTime = new Date(events[currentEventIndex].timestamp);
                if (eventTime <= currentSimTime) {
                    currentEventIndex++;
                } else {
                    break;
                }
            }

            if (currentEventIndex >= events.length || currentSimTime >= simEndTime) {
                isPlaying = false;
                document.getElementById('play-pause-btn').textContent = 'Replay';
                document.getElementById('play-pause-btn').classList.remove('pause');
                return;
            }

            animationFrameId = requestAnimationFrame(animate);
        }

        function reset() {
            currentEventIndex = 0;
            isPlaying = false;
            startRealTime = null;
            pausedSimTime = 0;
            document.getElementById('progress-fill').style.width = '0%';
            if (events.length > 0) {
                document.getElementById('sim-time').textContent = formatTimeOnly(simStartTime);
            }
            document.getElementById('play-pause-btn').textContent = 'Play';
            document.getElementById('play-pause-btn').classList.remove('pause');
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
        }
    </script>
</body>
</html>
