            locoDiv.style.width = `${locoWidthPx}px`;
            locoDiv.style.background = '#222';
            locoDiv.title = `Locomotive for train ${trainId}`;
            locoDiv.textContent = 'L';
            trainDiv.appendChild(locoDiv);

            // Keep the status badge visible on-track: shows "Waiting" when idle,
            // or the current activity type while one is running.
            const badge = document.createElement('div');
            badge.className = 'train-status waiting';
            badge.id = `train-badge-${trainId}`;
            badge.textContent = 'Waiting';
            trainDiv.appendChild(badge);

            document.getElementById('main-content').appendChild(trainDiv);

            // Sync badge to whatever state the train is in (Waiting / activity name).
            updateTrainBadge(trainId);
        }

        // Mirror of updatePassageUI for the single exit-gate resource. Same
        // safe-to-call-early behaviour: if the DOM nodes haven't been rendered
        // yet (e.g. before main-content becomes visible) we just bail out.
        function updateExitGateUI() {
            const strip = document.getElementById('exit-gate-strip');
            const pill = document.getElementById('exit-gate-pill');
            if (!strip || !pill) return;

            if (exitGateState.available) {
                strip.classList.remove('used');
                pill.classList.remove('used');
                pill.textContent = 'Exit Gate: Available';
            } else {
                strip.classList.add('used');
                pill.classList.add('used');
                const who = exitGateState.usedByOutboundTrainId || '?';
                pill.textContent = `Exit Gate: Used by ${who}`;
            }
        }

        // Push the passageState into the DOM (strip color + pill text/colour).
        // Safe to call before main-content becomes visible — querySelectors return
        // null and we just bail out.
        function updatePassageUI() {
            const strip = document.getElementById('passage-strip');
            const pill = document.getElementById('passage-pill');
            if (!strip || !pill) return;

            if (passageState.available) {
                strip.classList.remove('used');
                pill.classList.remove('used');
                pill.textContent = 'Available';
            } else {
                strip.classList.add('used');
                pill.classList.add('used');
                const who = passageState.usedByTrainId || '?';
                pill.textContent = `Used by ${who}`;
            }
        }

        // Look up a wagon-group's metadata (length, destination, id) by scanning
        // all known trains. WGs become standalone entities after PushOff, so we
        // need to remember what train they came from to preserve size/color.
        function findWagonGroupMeta(wgId) {
            for (const tId in trains) {
                const t = trains[tId];
                if (!t || !t.wagonGroups) continue;
                for (const wg of t.wagonGroups) {
                    if (wg.id === wgId) return wg;
                }
            }
            return null;
        }

        // Push the wagonGroupActivities state into a WG's badge.
        function updateWagonGroupBadge(wgId) {
            const badge = document.getElementById(`wg-badge-${wgId}`);
            if (!badge) return;
            const active = wagonGroupActivities[wgId];
            if (active) {
                badge.classList.remove('waiting');
                badge.classList.add('activity');
                badge.textContent = active;
            } else {
                badge.classList.remove('activity');
                badge.classList.add('waiting');
                badge.textContent = 'Waiting';
            }
        }

        // List standalone WG IDs currently parked on a given classification track.
        // Used when a TRAIN-level activity (OBTP / DEPD) targets a track and we
        // need to fan its status out to every WG sitting on it.
        function findWagonGroupsOnTrack(trackId) {
            const result = [];
            for (const wgId in placedWagonGroups) {
                const el = placedWagonGroups[wgId];
                if (el && el.dataset.atTrack === trackId) result.push(wgId);
            }
            return result;
        }

        // Resolve an ActivityId to the list of WGs whose badges it should drive.
        //   - SEC / COP target a single WG (entityId == wgId).
        //   - OBTP / DEPD target an OutboundTrain (entityId == trainId), but the
        //     activity's location token IS the classification track, so we light
        //     up every WG currently sitting on that track.
        //   - PushOffDrive: explicitly excluded. Its entityId is a "+"-joined
        //     combo of WGs that aren't on the classification track yet (they're
        //     mid-push), so falling back to findWagonGroupsOnTrack would
        //     incorrectly stamp PushOffDrive on EARLIER WGs already parked on
        //     the same destination track and minding their own business.
        // Returns [] if no match (e.g. the activity hits the arrival track).
        function findWagonGroupsForActivity(activityId, activityType) {
            if (activityType === 'PushOffDrive') return [];

            const parts = String(activityId || '').split('_');
            if (parts.length < 5) return [];
            const entityId = parts[2];
            const location = parts[parts.length - 1];

            // SEC/COP now target a whole cut (consecutive same-destination WGs
            // pushed together): entityId is "wg1+wg2+...". Light up exactly the
            // placed members of the cut rather than falling through to the
            // whole-track scan (which would stamp bystander WGs from earlier
            // cuts on the same track).
            if (entityId.indexOf('+') !== -1) {
                const members = entityId.split('+').filter(id => placedWagonGroups[id]);
                if (members.length > 0) return members;
            }

            if (placedWagonGroups[entityId]) return [entityId];
            return findWagonGroupsOnTrack(location);
        }

        // Find which train a wagon group belongs to. Used to remove the WG's
        // graphic from its parent train when EntityCreated fires.
        function findTrainIdForWagonGroup(wgId) {
            for (const tId in trains) {
                const t = trains[tId];
                if (!t || !t.wagonGroups) continue;
                for (const wg of t.wagonGroups) {
                    if (wg.id === wgId) return tId;
                }
            }
            return null;
        }

        // Pop one wagon-group rectangle out of its parent train graphic. Called
        // when EntityCreated fires (the WG has been pushed onto its classification
        // track and is now standalone). After removal, re-anchor the train so the
        // L-box stays pinned at the original right-edge anchor — this matches the
        // physical reality of the loco pulling the remaining train back to its
        // original position between sub-drives.
        function removeWagonFromTrain(trainId, wgId) {
            const trainDiv = document.getElementById(`train-${trainId}`);
            if (!trainDiv) return;

            const wgDiv = trainDiv.querySelector(`.wagon-group[data-wg-id="${wgId}"]`);
            if (!wgDiv) return;

            wgDiv.remove();

            // Re-compute the train's body width from what's left and re-anchor.
            const anchorX = parseFloat(trainDiv.dataset.anchorX);
            if (isNaN(anchorX)) return;

            let remainingPx = 0;
            trainDiv.querySelectorAll('.wagon-group').forEach(el => {
                remainingPx += parseFloat(el.style.width) || 0;
            });
            const locoEl = trainDiv.querySelector('.locomotive');
            if (locoEl) remainingPx += parseFloat(locoEl.style.width) || 0;

            trainDiv.style.left = `${anchorX - remainingPx}px`;
        }

        // Draw a wagon-group as its own standalone entity on a classification track.
        // Called on WagonGroupEvent "EntityCreated" — the signal from PushOffActivity
        // that this WG has been pushed onto its destination track and is now
        // independent of its parent train.
        //
        // Layout: WGs stack RIGHT-to-LEFT from the classification track's anchor
        // point, mimicking the shunt-yard behavior where each pushed group gets
        // "parked" behind the previously-pushed groups (deeper into the track).
        function drawWagonGroupOnClassificationTrack(wgId, trackId) {
            if (placedWagonGroups[wgId]) return;  // already drawn — ignore duplicates

            const meta = findWagonGroupMeta(wgId);
            if (!meta) {
                console.warn(`WG ${wgId} has no metadata — can't draw`);
                return;
            }

            const pos = getTrackPosition(trackId);
            if (!pos) {
                console.warn(`WG ${wgId}: classification track ${trackId} has no position — add it to classificationTrackPositions`);
                return;
            }

            const pixelsPerMeter = 1.2;
            const widthPx = (meta.length || 0) * pixelsPerMeter;
            const alreadyFilled = classificationTrackFill[trackId] || 0;

            const wgDiv = document.createElement('div');
            wgDiv.className = 'wagon-group wg-standalone';
            wgDiv.id = `wg-${wgId}`;
            wgDiv.dataset.wagonGroupId = wgId;
            wgDiv.dataset.atTrack = trackId;
            wgDiv.style.position = 'absolute';
            wgDiv.style.width = `${widthPx}px`;
            wgDiv.style.background = destColors[meta.destination] || destColors['Unknown'];
            wgDiv.textContent = wgId;
            wgDiv.title = `${wgId}: ${meta.length}m → ${meta.destination} (on ${trackId})`;

            // Right-anchor at pos.x, growing leftward so each new arrival pushes
            // deeper into the track behind the already-parked groups.
            wgDiv.style.left = `${pos.x - alreadyFilled - widthPx}px`;
            wgDiv.style.top = `${pos.y}px`;
            wgDiv.style.zIndex = '4';

            // Status pill (child of the WG so it tracks position automatically and
            // is removed in lockstep with the WG itself).
            const badge = document.createElement('div');
            badge.className = 'wg-status waiting';
            badge.id = `wg-badge-${wgId}`;
            badge.textContent = 'Waiting';
            wgDiv.appendChild(badge);

            document.getElementById('main-content').appendChild(wgDiv);

            classificationTrackFill[trackId] = alreadyFilled + widthPx;
            placedWagonGroups[wgId] = wgDiv;

            // If this WG was already secured before being (re)drawn — e.g. an
            // event replay — restore the S badge so the visual matches state.
            if (meta.status === 'Secured') {
                addSecuredBadge(wgId);
            }
        }

        // Draw the black frame + L box around all WGs sitting on the given
        // classification track. Called once OutboundTrainPreparation completes
        // for an outgoing train. The frame spans the union of WG bounding
        // rectangles; the L box is placed flush against its right edge.
        function drawOutboundTrainFrame(outboundTrainId, trackId) {
            if (placedOutboundTrains[outboundTrainId]) return;  // idempotent

            const wgIds = findWagonGroupsOnTrack(trackId);
            if (wgIds.length === 0) return;

            let minLeft = Infinity;
            let maxRight = -Infinity;
            let topY = 0;
            let height = 11;
            for (const wgId of wgIds) {
                const el = placedWagonGroups[wgId];
                if (!el) continue;
                const left = parseFloat(el.style.left);
                const width = parseFloat(el.style.width);
                const elTop = parseFloat(el.style.top);
                if (isNaN(left) || isNaN(width) || isNaN(elTop)) continue;
                if (left < minLeft) minLeft = left;
                if (left + width > maxRight) maxRight = left + width;
                topY = elTop;
                height = el.offsetHeight || 11;
            }
            if (!isFinite(minLeft)) return;

            const padding = 2;
            const main = document.getElementById('main-content');

            const frameDiv = document.createElement('div');
            frameDiv.className = 'outbound-train-frame';
            frameDiv.dataset.outboundTrainId = outboundTrainId;
            frameDiv.style.left = `${minLeft - padding}px`;
            frameDiv.style.top = `${topY - padding}px`;
            frameDiv.style.width = `${(maxRight - minLeft) + padding * 2}px`;
            frameDiv.style.height = `${height + padding * 2}px`;
            frameDiv.title = `Outgoing train ${outboundTrainId}`;
            main.appendChild(frameDiv);

            const locoDiv = document.createElement('div');
            locoDiv.className = 'outbound-train-loco';
            locoDiv.dataset.outboundTrainId = outboundTrainId;
            locoDiv.textContent = 'L';
            locoDiv.title = `Locomotive for outgoing train ${outboundTrainId}`;
            locoDiv.style.left = `${maxRight + padding}px`;
            locoDiv.style.top = `${topY}px`;
            main.appendChild(locoDiv);

            placedOutboundTrains[outboundTrainId] = { frameDiv, locoDiv, trackId, wgIds };
        }

        // Tear down a previously-drawn outbound train frame + L box. Currently
        // only used by reset(), but kept as a separate helper so a future
        // departure-removal path can call it.
        function removeOutboundTrainFrame(outboundTrainId) {
            const entry = placedOutboundTrains[outboundTrainId];
            if (!entry) return;
            if (entry.frameDiv) entry.frameDiv.remove();
            if (entry.locoDiv) entry.locoDiv.remove();
            delete placedOutboundTrains[outboundTrainId];
        }

        // ─── Departure area (bottom-left) ─────────────────────────────────
        //
        // Mirrors the entry-queue pattern (drawTrainInQueue + relayoutQueue):
        // when an OBT enters DepartureDrive we (a) tear down its on-track
        // representation (WG rectangles, frame, L box) and (b) pop a smaller,
        // greyed copy of the train into a vertical stack at the bottom-left.
        // The first slot lives at (25, 875) and each subsequent train sits
        // 25 px lower, so the stack grows downward as more trains depart.

        const DEPARTURE_AREA_X = 25;
        const DEPARTURE_AREA_Y_TOP = 875;
        const DEPARTURE_AREA_Y_STEP = 25;

        function getDepartureIndex(trainId) {
            // Stable index by existing departure-area DOM order — keeps a
            // train's slot fixed across replays / re-renders. New arrivals
            // get appended to the bottom.
            const departing = Array.from(document.querySelectorAll('.train.departing'));
            const ids = departing.map(el => el.dataset.outboundTrainId).filter(Boolean);
            const existingIndex = ids.indexOf(trainId);
            if (existingIndex >= 0) return existingIndex;
            return ids.length;
        }

        function relayoutDepartureArea() {
            const departing = Array.from(document.querySelectorAll('.train.departing'));
            departing.forEach((el, idx) => {
                // Image-space y → container-space y via applyImageYOffset, the
                // same bottom-anchor convention every other on-canvas element
                // uses (track positions, worker slots, etc).
                const pos = applyImageYOffset({
                    x: DEPARTURE_AREA_X,
                    y: DEPARTURE_AREA_Y_TOP + idx * DEPARTURE_AREA_Y_STEP
                });
                el.style.top = `${pos.y}px`;
            });
        }

        // Detach every WG that belongs to this OBT from its classification
        // track: removes the DOM nodes (.wg-standalone), drops the entries
        // from placedWagonGroups, and zeroes classificationTrackFill for the
        // freed track so future arrivals on the same physical track don't
        // start from a stale fill offset.
        function removeOutboundWGsFromTrack(outboundTrainId) {
            const entry = placedOutboundTrains[outboundTrainId];
            if (!entry) return;
            const wgIds = entry.wgIds || [];
            for (const wgId of wgIds) {
                const el = placedWagonGroups[wgId];
                if (el && el.parentNode) el.parentNode.removeChild(el);
                delete placedWagonGroups[wgId];
            }
            if (entry.trackId) {
                classificationTrackFill[entry.trackId] = 0;
            }
        }

        // Build the smaller, greyed copy of the OBT inside the departure area.
        // Pulls per-WG metadata via findWagonGroupMeta, mirrors the entry-queue
        // train layout (wagons left → loco right), and tags grey-a / grey-b on
        // alternating WGs to match the in-queue greyed look. The transform:
        // scale lives in the .train.departing CSS rule, so width/top math here
        // stays in untransformed pixels.
        function drawTrainInDepartureArea(outboundTrainId) {
            if (placedDepartingTrains[outboundTrainId]) return;  // idempotent
            const entry = placedOutboundTrains[outboundTrainId];
            if (!entry) return;
            const wgIds = entry.wgIds || [];
            if (wgIds.length === 0) return;

            // All WGs in an OBT share the same destination — pick the first
            // one's metadata for the badge text.
            const firstMeta = findWagonGroupMeta(wgIds[0]);
            const destination = firstMeta ? firstMeta.destination : 'Unknown';

            const trainDiv = document.createElement('div');
            trainDiv.className = 'train departing';
            trainDiv.id = `departing-${outboundTrainId}`;
            trainDiv.dataset.outboundTrainId = outboundTrainId;
            trainDiv.style.position = 'absolute';
            const idx = getDepartureIndex(outboundTrainId);
            // Convert the image-space coordinate (matching the {x:25,y:875}
            // anchor used everywhere else in the visualizer) into a real
            // container-space pixel via applyImageYOffset. Without this the
            // raw y=875 lands near the bottom edge of the viewport on a
            // 1080p screen and is mostly off-screen on smaller ones.
            const pos = applyImageYOffset({
                x: DEPARTURE_AREA_X,
                y: DEPARTURE_AREA_Y_TOP + idx * DEPARTURE_AREA_Y_STEP
            });
            trainDiv.style.left = `${pos.x}px`;
            trainDiv.style.top = `${pos.y}px`;

            const pixelsPerMeter = 1.2;  // raw scale; CSS .train.departing
                                          // applies the visible 0.65× shrink.

            // Wagons in source order, then the locomotive on the right —
            // matches the in-queue / on-track layout direction.
            wgIds.forEach((wgId, i) => {
                const meta = findWagonGroupMeta(wgId);
                if (!meta) return;
                const wgDiv = document.createElement('div');
                wgDiv.className = `wagon-group ${i % 2 === 0 ? 'grey-a' : 'grey-b'}`;
                wgDiv.style.width = `${(meta.length || 0) * pixelsPerMeter}px`;
                wgDiv.textContent = wgId;
                wgDiv.title = `${wgId}: ${meta.length}m → ${meta.destination}`;
                trainDiv.appendChild(wgDiv);
            });

            const locoDiv = document.createElement('div');
            locoDiv.className = 'locomotive';
            locoDiv.style.width = '24px';
            locoDiv.style.background = '#222';
            locoDiv.title = `Locomotive for outbound train ${outboundTrainId}`;
            locoDiv.textContent = 'L';
            trainDiv.appendChild(locoDiv);

            const badge = document.createElement('div');
            badge.className = 'train-status driving';
            badge.textContent = `Driving to ${destination}`;
            trainDiv.appendChild(badge);

            document.getElementById('main-content').appendChild(trainDiv);
            placedDepartingTrains[outboundTrainId] = trainDiv;
        }

        // Tear down a departing-train block once DEPD completes (the OBT has
        // physically exited the system). Re-stacks the remaining departing
        // trains so the gap is closed.
        function removeTrainFromDepartureArea(outboundTrainId) {
            const el = placedDepartingTrains[outboundTrainId];
            if (el && el.parentNode) el.parentNode.removeChild(el);
            delete placedDepartingTrains[outboundTrainId];
            relayoutDepartureArea();
        }

        // Stamp the small green "S" badge onto a WG and flip its `status`
        // metadata field so the secured state persists across re-draws.
        // Idempotent: a second call on an already-badged WG is a no-op.
        function addSecuredBadge(wgId) {
            const wgEl = placedWagonGroups[wgId];
            if (!wgEl) return;
            if (wgEl.querySelector('.wg-secured-badge')) return;

            const meta = findWagonGroupMeta(wgId);
            if (meta) meta.status = 'Secured';

            const badge = document.createElement('div');
            badge.className = 'wg-secured-badge';
            badge.textContent = 'S';
            badge.title = `${wgId} is secured`;
            wgEl.appendChild(badge);
        }

        // Remove the whole train graphic after PushOff completes. The wagons have
        // already been re-drawn as standalone entities on their classification
        // tracks; only the (now empty) arrival-track train div needs to go.
        function removeTrainFromTrack(trainId) {
            const el = document.getElementById(`train-${trainId}`);
            if (el) el.remove();
            if (trains[trainId]) {
                trains[trainId].queueState = 'dismantled';
                trains[trainId].activeActivities = [];
            }
        }

        function reset() {
            currentEventIndex = 0;
            isPlaying = false;
            startRealTime = null;
            pausedSimTime = 0;
            document.getElementById('progress-fill').style.width = '0%';
            if (events.length > 0) {
                document.getElementById('sim-time').textContent = formatSimDateTime(simStartTime);
            }

            const mainContent = document.getElementById('main-content');
            const trainDivs = mainContent.querySelectorAll('.train');
            trainDivs.forEach(div => div.remove());

            // Tear down any standalone wagon-group entities from a previous run.
            // Their badges are children, so they go away with them.
            mainContent.querySelectorAll('.wg-standalone').forEach(div => div.remove());
            classificationTrackFill = {};
            placedWagonGroups = {};
            wagonGroupActivities = {};

            // Tear down outbound-train frames + L boxes from the previous run
            // and clear the registry so re-replay starts clean.
            mainContent.querySelectorAll('.outbound-train-frame, .outbound-train-loco').forEach(div => div.remove());
            placedOutboundTrains = {};

            // Tear down any departure-area trains and clear that registry too.
            mainContent.querySelectorAll('.train.departing').forEach(div => div.remove());
            placedDepartingTrains = {};

            // Clear the per-WG `status` field (currently only "Secured") so
            // a replay doesn't carry secured-state across runs.
            for (const tId in trains) {
                const t = trains[tId];
                if (!t || !t.wagonGroups) continue;
                for (const wg of t.wagonGroups) delete wg.status;
            }

            // Restore the passage track to "available" / green.
            passageState = { available: true, usedByTrainId: null };
            updatePassageUI();

            // Restore the exit gate to "available" / green.
            exitGateState = { available: true, usedByOutboundTrainId: null };
            updateExitGateUI();

            // Clear per-train replay state so a fresh run starts from scratch.
            for (const tId in trains) {
                trains[tId].queueState = 'waiting';
                trains[tId].driveStart = null;
                trains[tId].driveEnd = null;
                trains[tId].activeActivities = [];
            }

            // Wipe the worker↔activity bookkeeping too.
            activityWorkers = {};
            activeActivityIds = new Set();

            // Return any workers / shunt locos that were teleported onto a track back into their grid.
            document.querySelectorAll('.worker-icon[data-teleported="1"]').forEach(el => {
                const id = el.id.replace(/^worker-/, '').replace(/^shuntloco-/, '');
                teleportWorkerBackToGrid(id);
            });

            // Reset every worker / loco status marker back to Idle
            document.querySelectorAll('.worker-icon .worker-status').forEach(el => {
                el.textContent = 'Idle';
                el.className = 'worker-status status-Idle';
            });
            document.querySelectorAll('.worker-icon').forEach(el => {
                delete el.dataset.state;
            });

            const btn = document.getElementById('play-pause-btn');
            btn.textContent = 'Play';
            btn.classList.remove('pause');
        }
    </script>
</body>
</html>
