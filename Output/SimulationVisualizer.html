<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiener Neustadt Simulation Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: white;
            color: #333;
        }

        /* Progress Bar */
        #progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            position: relative;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #45a049);
            width: 0%;
            transition: width 0.1s linear;
        }

        /* Control Panel */
        #control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
        }

        #sim-time {
            font-size: 24px;
            font-weight: bold;
            color: #2196F3;
            font-family: 'Courier New', monospace;
        }

        #controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        button {
            padding: 10px 20px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #2196F3;
            color: white;
            font-weight: 600;
            transition: background 0.3s;
        }

            button:hover {
                background: #1976D2;
            }

            button:active {
                transform: scale(0.98);
            }

            button.pause {
                background: #FF9800;
            }

                button.pause:hover {
                    background: #F57C00;
                }

        #speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #speed-slider {
            width: 150px;
            cursor: pointer;
        }

        #speed-label {
            font-size: 14px;
            font-weight: 600;
            min-width: 60px;
            text-align: right;
        }

        /* File Upload - inline in control panel */
        #file-upload {
            padding: 6px 12px;
            border: 2px dashed #ccc;
            border-radius: 5px;
            background: #fafafa;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

            #file-upload:hover {
                border-color: #2196F3;
                background: #f0f8ff;
            }

            #file-upload.loaded {
                border-color: #4CAF50;
                background: #f1f8f4;
            }

        #file-input {
            display: none;
        }

        #file-label {
            font-size: 12px;
            color: #666;
        }

        #file-upload.loaded #file-label {
            color: #4CAF50;
            font-weight: 600;
        }

        /* Main Content */
        #main-content {
            display: none;
            width: 100%;
            height: calc(100vh - 8px - 70px);
            position: relative;
            background-image: url('vis_background_v1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

            #main-content.visible {
                display: block;
            }

        /* Worker Icons Overlay */
        #worker-grid {
            position: absolute;
            top: 40px;
            left: 700px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            max-width: 400px;
        }

        /* Shunting Loco Icons Overlay */
        #shuntloco-grid {
            position: absolute;
            top: 40px;
            left: 1150px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            max-width: 400px;
        }

        /* Shared icon style */
        .worker-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

            .worker-icon img {
                width: 40px;
                height: 40px;
                object-fit: contain;
                filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.5));
            }

            .worker-icon span {
                font-size: 9px;
                color: white;
                text-shadow: 1px 1px 2px black;
                font-weight: 600;
                text-align: center;
                max-width: 50px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

        /* Train canvas overlay */
        #train-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Legend */
        #legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            border-radius: 8px;
            padding: 10px 14px;
            display: none;
            flex-direction: column;
            gap: 6px;
            min-width: 120px;
        }

            #legend.visible {
                display: flex;
            }

        #legend-title {
            font-size: 11px;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-swatch {
            width: 18px;
            height: 12px;
            border-radius: 2px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .legend-label {
            font-size: 11px;
            color: white;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <!-- Progress Bar -->
    <div id="progress-bar">
        <div id="progress-fill"></div>
    </div>

    <!-- Control Panel -->
    <div id="control-panel">
        <div id="controls">
            <button id="play-pause-btn" onclick="togglePlayPause()">Play</button>
            <div id="speed-control">
                <label for="speed-slider">Speed:</label>
                <input type="range" id="speed-slider" min="1" max="200" value="10" oninput="updateSpeed()">
                <span id="speed-label">10x</span>
            </div>
            <button onclick="reset()">Reset</button>
            <div id="file-upload" onclick="document.getElementById('file-input').click()">
                <input type="file" id="file-input" accept=".csv" onchange="loadCSV(event)">
                <p id="file-label">📂 Load CSV</p>
            </div>
        </div>
        <div id="sim-time">09:00:00</div>
    </div>

    <!-- Main Content: background image + overlays -->
    <div id="main-content">
        <canvas id="train-canvas"></canvas>
        <div id="worker-grid"></div>
        <div id="shuntloco-grid"></div>
        <div id="legend">
            <div id="legend-title">Destinations</div>
        </div>
    </div>

    <script>
        let events = [];
        let currentEventIndex = 0;
        let isPlaying = false;
        let playbackSpeed = 10;
        let animationFrameId = null;
        let startRealTime = null;
        let pausedSimTime = 0;
        let simStartTime = null;
        let simEndTime = null;
        let workers = [];
        let shuntLocos = [];

        // Train state: trainId -> { wagonGroups: [{id, length, destination}], track, status }
        let trainState = {};

        // Destination -> color mapping (auto-assigned)
        const DEST_COLORS = [
            '#E53935', '#8E24AA', '#1E88E5', '#00897B',
            '#F4511E', '#FFB300', '#43A047', '#00ACC1',
            '#3949AB', '#D81B60', '#6D4C41', '#039BE5'
        ];
        let destColorMap = {};
        let destColorIndex = 0;

        function getDestColor(dest) {
            if (!destColorMap[dest]) {
                destColorMap[dest] = DEST_COLORS[destColorIndex % DEST_COLORS.length];
                destColorIndex++;
                updateLegend();
            }
            return destColorMap[dest];
        }

        function updateLegend() {
            const legend = document.getElementById('legend');
            // Remove old items (keep title)
            const title = document.getElementById('legend-title');
            legend.innerHTML = '';
            legend.appendChild(title);
            for (const [dest, color] of Object.entries(destColorMap)) {
                const item = document.createElement('div');
                item.className = 'legend-item';
                item.innerHTML = `
                            <div class="legend-swatch" style="background:${color}"></div>
                            <span class="legend-label">${dest}</span>
                        `;
                legend.appendChild(item);
            }
            legend.classList.add('visible');
        }

        // ── Canvas drawing ──────────────────────────────────────────────
        // Each train is drawn as a horizontal bar of wagon-group rectangles.
        // We stack trains vertically for now (simple layout).
        // Constants (tweak to match your background image layout):
        const TRAIN_BAR_HEIGHT = 18;   // px height of each wagon group rect
        const TRAIN_BAR_MARGIN = 8;    // px vertical gap between trains
        const TRAIN_START_X = 40;      // px from left where trains start
        const TRAIN_START_Y = 40;      // px from top where first train is drawn
        const PIXELS_PER_UNIT = 2;     // px per length unit

        function resizeCanvas() {
            const canvas = document.getElementById('train-canvas');
            const mc = document.getElementById('main-content');
            canvas.width = mc.clientWidth;
            canvas.height = mc.clientHeight;
        }

        function drawTrains() {
            const canvas = document.getElementById('train-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const activeTrains = Object.values(trainState).filter(t => t.visible);
            let y = TRAIN_START_Y;

            for (const train of activeTrains) {
                let x = TRAIN_START_X;

                // Draw train ID label
                ctx.fillStyle = 'white';
                ctx.font = 'bold 10px Segoe UI';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'black';
                ctx.shadowBlur = 3;
                ctx.fillText(`T${train.id}`, x - 35, y + TRAIN_BAR_HEIGHT / 2);
                ctx.shadowBlur = 0;

                // Draw each wagon group
                for (const wg of train.wagonGroups) {
                    const w = wg.length * PIXELS_PER_UNIT;
                    const color = getDestColor(wg.destination);

                    // Filled rect
                    ctx.fillStyle = color;
                    ctx.fillRect(x, y, w, TRAIN_BAR_HEIGHT);

                    // Border
                    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x, y, w, TRAIN_BAR_HEIGHT);

                    // Label inside rect if wide enough
                    if (w > 30) {
                        ctx.fillStyle = 'white';
                        ctx.font = '9px Segoe UI';
                        ctx.textBaseline = 'middle';
                        ctx.shadowColor = 'black';
                        ctx.shadowBlur = 2;
                        ctx.fillText(wg.destination, x + 4, y + TRAIN_BAR_HEIGHT / 2);
                        ctx.shadowBlur = 0;
                    }

                    x += w;
                }

                // Track label after the train bar
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.font = '10px Segoe UI';
                ctx.textBaseline = 'middle';
                ctx.fillText(train.track ? `▶ Track ${train.track}` : '', x + 6, y + TRAIN_BAR_HEIGHT / 2);

                y += TRAIN_BAR_HEIGHT + TRAIN_BAR_MARGIN;
            }
        }

        // ── CSV / Meta parsing ──────────────────────────────────────────

        function loadCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const content = e.target.result;
                parseMeta(content);
                parseCSV(content);

                document.getElementById('file-upload').classList.add('loaded');
                document.getElementById('file-label').textContent = `✅ Loaded: ${file.name} (${events.length} events)`;
                document.getElementById('main-content').classList.add('visible');

                renderWorkerGrid();
                renderShuntLocoGrid();
                resizeCanvas();

                if (events.length > 0) {
                    document.getElementById('sim-time').textContent = formatTimeOnly(simStartTime);
                }
            };
            reader.readAsText(file);
        }

        function parseMeta(content) {
            workers = [];
            shuntLocos = [];
            const lines = content.trim().split('\n');
            for (const line of lines) {
                const trimmed = line.trim();
                if (trimmed === '#ENDMETA') break;
                const values = trimmed.split(';').map(v => v.trim());
                if (values[0] === '#WORKER') {
                    workers.push({ id: values[1], name: values[2], speed: values[3] });
                }
                if (values[0] === '#SHUNTLOCO') {
                    shuntLocos.push({ id: values[1], name: values[2], speed: values[3] });
                }
            }
        }

        function parseCSV(content) {
            const lines = content.trim().split('\n');
            events = [];

            // Find where meta ends
            let dataStart = 0;
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].trim() === '#ENDMETA') {
                    dataStart = i + 1;
                    break;
                }
            }

            // Skip header row after meta
            for (let i = dataStart + 1; i < lines.length; i++) {
                const raw = lines[i];
                if (!raw.trim()) continue;
                const values = raw.split(';').map(v => v.trim());
                if (values.length < 3) continue;

                events.push({
                    eventType: values[0],
                    entityId: values[1],
                    event: values[2],
                    timestamp: values[3],
                    details: values[4] || ''
                });
            }

            if (events.length > 0) {
                simStartTime = new Date(events[0].timestamp);
                simEndTime = new Date(events[events.length - 1].timestamp);
                console.log(`✅ Loaded ${events.length} events`);
                console.log(`⏰ Duration: ${formatTimeOnly(simStartTime)} → ${formatTimeOnly(simEndTime)}`);
            }
        }

        // Parse the Details field of a TrainEvent;Entry row
        // e.g. trainId=11001|length=144|wgIds=...|wgs=1100101:64:Graz  1100102:48:Vienna
        function parseEntryDetails(details) {
            const parts = {};
            for (const segment of details.split('|')) {
                const eq = segment.indexOf('=');
                if (eq === -1) continue;
                parts[segment.slice(0, eq).trim()] = segment.slice(eq + 1).trim();
            }

            const wagonGroups = [];
            if (parts['wgs']) {
                // Tab-separated wagon groups: id:length:destination
                const wgTokens = parts['wgs'].split('\t').map(s => s.trim()).filter(Boolean);
                for (const token of wgTokens) {
                    const [id, length, destination] = token.split(':');
                    if (id && length && destination) {
                        wagonGroups.push({
                            id: id.trim(),
                            length: parseInt(length.trim()),
                            destination: destination.trim()
                        });
                    }
                }
            }

            return {
                trainId: parts['trainId'] || '',
                totalLength: parseInt(parts['length'] || '0'),
                wagonGroups
            };
        }

        // ── Event processing ────────────────────────────────────────────

        function processEvent(ev) {
            if (ev.eventType !== 'TrainEvent') return;

            const trainId = ev.entityId;

            if (ev.event === 'Entry') {
                const parsed = parseEntryDetails(ev.details);
                trainState[trainId] = {
                    id: trainId,
                    wagonGroups: parsed.wagonGroups,
                    track: null,
                    visible: true
                };
            }

            if (ev.event === 'AssignedArrivalTrack') {
                if (trainState[trainId]) {
                    trainState[trainId].track = ev.details.trim();
                }
            }

            // Hide train when it departs / exits
            if (ev.event === 'Exit' || ev.event === 'Departed') {
                if (trainState[trainId]) {
                    trainState[trainId].visible = false;
                }
            }
        }

        // ── Rendering helpers ───────────────────────────────────────────

        function renderWorkerGrid() {
            const grid = document.getElementById('worker-grid');
            grid.innerHTML = '';
            for (const worker of workers) {
                const div = document.createElement('div');
                div.className = 'worker-icon';
                div.innerHTML = `
                            <img src="worker_icon.png" alt="${worker.name}" title="${worker.name} (${worker.id})">
                            <span>${worker.name}</span>
                        `;
                grid.appendChild(div);
            }
        }

        function renderShuntLocoGrid() {
            const grid = document.getElementById('shuntloco-grid');
            grid.innerHTML = '';
            for (const loco of shuntLocos) {
                const div = document.createElement('div');
                div.className = 'worker-icon';
                div.innerHTML = `
                            <img src="shunting_loco.png" alt="${loco.name}" title="${loco.name} (${loco.id})">
                            <span>${loco.name}</span>
                        `;
                grid.appendChild(div);
            }
        }

        // ── Playback ────────────────────────────────────────────────────

        function formatTimeOnly(date) {
            const hour = String(date.getHours()).padStart(2, '0');
            const minute = String(date.getMinutes()).padStart(2, '0');
            const second = String(date.getSeconds()).padStart(2, '0');
            return `${hour}:${minute}:${second}`;
        }

        function togglePlayPause() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('play-pause-btn');

            if (isPlaying) {
                btn.textContent = 'Pause';
                btn.classList.add('pause');
                startRealTime = Date.now();
                animate();
            } else {
                btn.textContent = 'Play';
                btn.classList.remove('pause');

                const realElapsed = Date.now() - startRealTime;
                pausedSimTime += realElapsed * playbackSpeed;

                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                }
            }
        }

        function updateSpeed() {
            const oldSpeed = playbackSpeed;
            playbackSpeed = parseInt(document.getElementById('speed-slider').value);
            document.getElementById('speed-label').textContent = `${playbackSpeed}x`;

            if (isPlaying) {
                const realElapsed = Date.now() - startRealTime;
                pausedSimTime += realElapsed * oldSpeed;
                startRealTime = Date.now();
            }
        }

        function animate() {
            if (!isPlaying || !events.length) return;

            const realElapsed = Date.now() - startRealTime;
            const totalSimElapsed = pausedSimTime + (realElapsed * playbackSpeed);
            const currentSimTime = new Date(simStartTime.getTime() + totalSimElapsed);

            document.getElementById('sim-time').textContent = formatTimeOnly(currentSimTime);

            const totalDuration = simEndTime - simStartTime;
            const currentProgress = currentSimTime - simStartTime;
            const progressPercent = Math.min((currentProgress / totalDuration) * 100, 100);
            document.getElementById('progress-fill').style.width = `${progressPercent}%`;

            let stateChanged = false;
            while (currentEventIndex < events.length) {
                const ev = events[currentEventIndex];
                const eventTime = new Date(ev.timestamp);
                if (eventTime <= currentSimTime) {
                    processEvent(ev);
                    currentEventIndex++;
                    stateChanged = true;
                } else {
                    break;
                }
            }

            if (stateChanged) {
                drawTrains();
            }

            if (currentEventIndex >= events.length || currentSimTime >= simEndTime) {
                isPlaying = false;
                document.getElementById('play-pause-btn').textContent = 'Replay';
                document.getElementById('play-pause-btn').classList.remove('pause');
                return;
            }

            animationFrameId = requestAnimationFrame(animate);
        }

        function reset() {
            currentEventIndex = 0;
            isPlaying = false;
            startRealTime = null;
            pausedSimTime = 0;
            trainState = {};
            destColorMap = {};
            destColorIndex = 0;

            document.getElementById('progress-fill').style.width = '0%';
            document.getElementById('legend').classList.remove('visible');
            document.getElementById('legend').innerHTML = '<div id="legend-title">Destinations</div>';

            const canvas = document.getElementById('train-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (events.length > 0) {
                document.getElementById('sim-time').textContent = formatTimeOnly(simStartTime);
            }
            document.getElementById('play-pause-btn').textContent = 'Play';
            document.getElementById('play-pause-btn').classList.remove('pause');
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            drawTrains();
        });
    </script>
</body>
</html>
