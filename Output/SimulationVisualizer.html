<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiener Neustadt Simulation Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: white;
            color: #333;
        }

        /* Progress Bar */
        #progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            position: relative;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #45a049);
            width: 0%;
            transition: width 0.1s linear;
        }

        /* Control Panel */
        #control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
        }

        #sim-time {
            font-size: 24px;
            font-weight: bold;
            color: #2196F3;
            font-family: 'Courier New', monospace;
        }

        #controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        button {
            padding: 10px 20px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #2196F3;
            color: white;
            font-weight: 600;
            transition: background 0.3s;
        }

            button:hover {
                background: #1976D2;
            }

            button:active {
                transform: scale(0.98);
            }

            button.pause {
                background: #FF9800;
            }

                button.pause:hover {
                    background: #F57C00;
                }

        #speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #speed-slider {
            width: 150px;
            cursor: pointer;
        }

        #speed-label {
            font-size: 14px;
            font-weight: 600;
            min-width: 60px;
            text-align: right;
        }

        /* File Upload */
        #file-upload {
            margin: 30px;
            padding: 40px;
            border: 3px dashed #ccc;
            border-radius: 10px;
            text-align: center;
            background: #fafafa;
            cursor: pointer;
            transition: all 0.3s;
        }

            #file-upload:hover {
                border-color: #2196F3;
                background: #f0f8ff;
            }

            #file-upload.loaded {
                border-color: #4CAF50;
                background: #f1f8f4;
            }

        #file-input {
            display: none;
        }

        #file-label {
            font-size: 18px;
            color: #666;
        }

        #file-upload.loaded #file-label {
            color: #4CAF50;
            font-weight: 600;
        }

        /* Main Content */
        #main-content {
            padding: 30px;
            display: none;
        }

            #main-content.visible {
                display: block;
            }

        /* Event Log */
        #event-log {
            margin-top: 20px;
            padding: 20px;
            background: #fafafa;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .event-line {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }

            .event-line:last-child {
                border-bottom: none;
            }

        .event-time {
            color: #2196F3;
            font-weight: bold;
        }

        .event-text {
            color: #333;
        }
    </style>
</head>
<body>
    <!-- Progress Bar -->
    <div id="progress-bar">
        <div id="progress-fill"></div>
    </div>

    <!-- Control Panel -->
    <div id="control-panel">
        <div id="controls">
            <button id="play-pause-btn" onclick="togglePlayPause()">Play</button>
            <div id="speed-control">
                <label for="speed-slider">Speed:</label>
                <input type="range" id="speed-slider" min="1" max="200" value="10" oninput="updateSpeed()">
                <span id="speed-label">10x</span>
            </div>
            <button onclick="reset()">Reset</button>
        </div>
        <div id="sim-time">09:00:00</div>
    </div>

    <!-- File Upload -->
    <div id="file-upload" onclick="document.getElementById('file-input').click()">
        <input type="file" id="file-input" accept=".csv" onchange="loadCSV(event)">
        <p id="file-label">📂 Click to load simulation CSV file</p>
    </div>

    <!-- Main Content -->
    <div id="main-content">
        <h2>Simulation Visualization</h2>
        <div id="event-log"></div>
    </div>

    <script>
        let events = [];
        let currentEventIndex = 0;
        let isPlaying = false;
        let playbackSpeed = 10;
        let animationFrameId = null;
        let startRealTime = null;
        let pausedSimTime = 0; // Track elapsed sim time when paused
        let simStartTime = null;
        let simEndTime = null;

        function loadCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const content = e.target.result;
                parseCSV(content);

                document.getElementById('file-upload').classList.add('loaded');
                document.getElementById('file-label').textContent = `✅ Loaded: ${file.name} (${events.length} events)`;
                document.getElementById('main-content').classList.add('visible');

                // Set initial time display
                if (events.length > 0) {
                    document.getElementById('sim-time').textContent = formatTimeOnly(simStartTime);
                }
            };
            reader.readAsText(file);
        }

        function parseCSV(content) {
            const lines = content.trim().split('\n');
            events = [];

            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(';').map(v => v.trim());
                if (values.length < 3) continue;

                const event = {
                    eventType: values[0],
                    entityId: values[1],
                    event: values[2],
                    timestamp: values[3],
                    details: values[4] || ''
                };
                events.push(event);
            }

            if (events.length > 0) {
                simStartTime = new Date(events[0].timestamp);
                simEndTime = new Date(events[events.length - 1].timestamp);
                console.log(`✅ Loaded ${events.length} events`);
                console.log(`⏰ Duration: ${formatTimeOnly(simStartTime)} → ${formatTimeOnly(simEndTime)}`);
            }
        }

        function formatTimeOnly(date) {
            const hour = String(date.getHours()).padStart(2, '0');
            const minute = String(date.getMinutes()).padStart(2, '0');
            const second = String(date.getSeconds()).padStart(2, '0');
            return `${hour}:${minute}:${second}`;
        }

        function togglePlayPause() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('play-pause-btn');

            if (isPlaying) {
                btn.textContent = 'Pause';
                btn.classList.add('pause');
                startRealTime = Date.now();
                animate();
            } else {
                btn.textContent = 'Play';
                btn.classList.remove('pause');

                // Calculate how much sim time has elapsed
                const realElapsed = Date.now() - startRealTime;
                pausedSimTime += realElapsed * playbackSpeed;

                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                }
            }
        }

        function updateSpeed() {
            const oldSpeed = playbackSpeed;
            playbackSpeed = parseInt(document.getElementById('speed-slider').value);
            document.getElementById('speed-label').textContent = `${playbackSpeed}x`;

            // If playing, update the baseline to account for speed change
            if (isPlaying) {
                const realElapsed = Date.now() - startRealTime;
                pausedSimTime += realElapsed * oldSpeed; // Add elapsed time at OLD speed
                startRealTime = Date.now(); // Reset real time counter
            }
        }

        function animate() {
            if (!isPlaying || !events.length) return;

            // Calculate current simulation time
            const realElapsed = Date.now() - startRealTime;
            const totalSimElapsed = pausedSimTime + (realElapsed * playbackSpeed);
            const currentSimTime = new Date(simStartTime.getTime() + totalSimElapsed);

            // Update sim time display
            document.getElementById('sim-time').textContent = formatTimeOnly(currentSimTime);

            // Update progress
            const totalDuration = simEndTime - simStartTime;
            const currentProgress = currentSimTime - simStartTime;
            const progressPercent = Math.min((currentProgress / totalDuration) * 100, 100);
            document.getElementById('progress-fill').style.width = `${progressPercent}%`;

            // Process events
            while (currentEventIndex < events.length) {
                const eventTime = new Date(events[currentEventIndex].timestamp);
                if (eventTime <= currentSimTime) {
                    displayEvent(events[currentEventIndex]);
                    currentEventIndex++;
                } else {
                    break;
                }
            }

            // Check if finished
            if (currentEventIndex >= events.length || currentSimTime >= simEndTime) {
                isPlaying = false;
                document.getElementById('play-pause-btn').textContent = 'Replay';
                document.getElementById('play-pause-btn').classList.remove('pause');
                return;
            }

            animationFrameId = requestAnimationFrame(animate);
        }

        function displayEvent(event) {
            const eventLog = document.getElementById('event-log');
            const eventLine = document.createElement('div');
            eventLine.className = 'event-line';
            const timestamp = new Date(event.timestamp);
            eventLine.innerHTML = `<span class="event-time">${formatTimeOnly(timestamp)}</span> | <span class="event-text">${event.entityId} - ${event.event} ${event.details}</span>`;
            eventLog.appendChild(eventLine);

            // Auto-scroll to bottom
            eventLog.scrollTop = eventLog.scrollHeight;
        }

        function reset() {
            currentEventIndex = 0;
            isPlaying = false;
            startRealTime = null;
            pausedSimTime = 0;
            document.getElementById('event-log').innerHTML = '';
            document.getElementById('progress-fill').style.width = '0%';
            if (events.length > 0) {
                document.getElementById('sim-time').textContent = formatTimeOnly(simStartTime);
            }
            document.getElementById('play-pause-btn').textContent = 'Play';
            document.getElementById('play-pause-btn').classList.remove('pause');
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
        }
    </script>
</body>
</html>
